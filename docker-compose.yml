services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: vipdoc_data
        target: /data/vipdoc
        read_only: true
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  vipdoc_data:
    name: easy_tdx_selector_vipdoc
