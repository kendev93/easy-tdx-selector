name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=selector_app --cov-report=term-missing
      - run: ruff format --check selector_app tests
      - run: ruff check selector_app tests
      - run: mypy selector_app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate desktop vipdoc override
        run: |
          mkdir -p "$RUNNER_TEMP/vipdoc"
          HOST_VIPDOC_PATH="$RUNNER_TEMP/vipdoc" docker compose \
            -f docker-compose.yml \
            -f docker-compose.local-vipdoc.yml \
            config --quiet
      - run: docker build --file Dockerfile --tag easy-tdx-selector-backend:ci .
      - run: docker build --file Dockerfile.frontend --tag easy-tdx-selector-frontend:ci .
