[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "easy-tdx-selector"
version = "0.1.0"
description = "Easy TDX 选股台：基于 easy-tdx 的本地公式选股应用"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "easy-tdx==1.20.8",
  "fastapi>=0.110,<1",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.9,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.4,<1",
]

[project.scripts]
easy-tdx-selector = "selector_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["selector_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"

[tool.coverage.run]
source = ["selector_app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
