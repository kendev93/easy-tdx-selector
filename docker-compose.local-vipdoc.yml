services:
  backend:
    # Host vipdoc files are commonly owned by the desktop user. Root is used
    # only in this explicitly selected local-sharing mode so sync can append
    # TDX-compatible records; the service still writes only inside /data/vipdoc.
    user: "0:0"
    volumes:
      - type: bind
        source: ${HOST_VIPDOC_PATH:?HOST_VIPDOC_PATH must point to the desktop TDX vipdoc directory}
        target: /data/vipdoc
